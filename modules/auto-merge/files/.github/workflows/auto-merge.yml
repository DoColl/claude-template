# Auto-merge a pull request once the CI workflow signs off on it.
#
# Flow: a pull request is opened, draft or not → the CI workflow runs as the
# "review" → on success the draft is lifted and the pull request is
# squash-merged, pinned to the commit CI validated → the commit the merge
# created is listed and judged again → its head branch is deleted. Policy,
# reasons and limits: docs/conventions/auto-merge-policy.md.
#
# The merge is a REST call (`PUT /repos/.../pulls/N/merge`) rather than
# `gh pr merge`, because `gh pr merge` shells out to a local `git` and this
# workflow never checks the repository out — the API call is server-side and
# needs no local git state.
#
# Why not native GitHub auto-merge (`gh pr merge --auto`)? It needs the
# "Allow auto-merge" repository setting, which GitHub does not offer on every
# plan for private repositories. The workflow_run trigger already gates on
# `conclusion == success`, so by the time the merge step runs CI is green — a
# synchronous merge has no race window worth waiting for native auto-merge for.
#
# After the merge: the merge below uses GITHUB_TOKEN, and GitHub does NOT emit
# a `push` event for refs updated by GITHUB_TOKEN (its recursive-run guard).
# Nothing that triggers on a push to the default branch — a deploy, a
# post-merge test run — fires after an auto-merge. This workflow dispatches
# nothing by default: docs/conventions/auto-merge-policy.md § After the merge
# says how to add a dispatch (workflow_dispatch is the documented exception)
# and what must come with it.
#
# Head-branch cleanup: GitHub's "Automatically delete head branches" setting
# was observed not to apply to merges made with GITHUB_TOKEN, so each job
# deletes the head ref itself after a successful merge — `contents: write`
# already covers it.
#
# Two sign-offs: where the project has an automated review workflow on its
# default branch (.github/workflows/claude-review.yml), a code pull request
# merges only once the CI workflow AND that review are green for the same
# commit. The review is started by CI's end (workflow_run), so it always runs
# the default branch's file, and names the commit it reviewed in its run name;
# its end starts this workflow, which then merges.
#
# Never merged unattended, by either job: a pull request touching a path
# CLAUDE_GATE_RE or PROJECT_GATE_RE matches (what Claude Code or git
# EXECUTES), or coming from a claude/issue-* or claude/rework-* head (what a
# CI Claude session wrote).

name: Auto-merge after CI

on:
  # Code pull requests: react to the CI workflow signing off the diff.
  # workflow_run runs with this repository's token on a run a pull request
  # started, which is why zizmor flags it. Accepted by design: the jobs act
  # only on a green run whose event is pull_request and whose head is in this
  # repository, they check nothing out and execute nothing the pull request
  # carries.
  # The second name is the automated review, which CI's end starts: its end
  # must start this workflow too. A name is no proof — any workflow can carry
  # it — so the job accepts a review run only when it was itself started by
  # workflow_run (a file only the default branch can hold) from the review's
  # file, and the sign-off step reads the review's runs by file (CI's by
  # name: every one must be green). With no review workflow,
  # that name never fires.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["__HARNESS_CI_WORKFLOW__", "Claude review"]
    types: [completed]
  # Docs pull requests: a CI workflow that ignores docs paths never runs on
  # them, so workflow_run never fires. Use a direct pull_request trigger
  # constrained to the same paths, since the docs gate has no CI to wait for.
  # For this event GitHub runs the workflow file as the PULL REQUEST writes
  # it, not the default branch's: a pull request that edits this file gets its
  # own promote-docs. Nothing in here can stop that; a ruleset on the default
  # branch does (docs/conventions/auto-merge-policy.md § Setting it up).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

# Least privilege: permissions are granted per job below.
permissions: {}

# gh normally finds the target repository from the local git remote. This
# workflow does not check the repository out (the merge is a pure API call),
# so gh would fail with "not a git repository". GH_REPO sidesteps the lookup
# for every `gh` command below.
env:
  GH_REPO: ${{ github.repository }}
  # Paths that are EXECUTED by Claude Code or git rather than read (ERE, matched
  # case-insensitively per path segment): any `.claude/` directory at any depth
  # (and a `.claude` symlink entry), CLAUDE.md / CLAUDE.local.md / AGENTS.md
  # anywhere (Claude Code reads an AGENTS.md as instructions wherever no
  # CLAUDE.md stands in for it), the git hooks directory, a project MCP config at any depth, the other paths a
  # Claude CI action treats as configuration read from the working directory
  # (`.claude.json`, `.ripgreprc`, `.gitmodules`, `.husky/`), what runs Claude
  # in CI and this workflow, and the gate with everything it runs or reads: the
  # runner, every guard (git runs them on each push through the pre-push hook,
  # the read-only agents run them, and they are what enforces all this), every
  # script the kit ships for its guards and workflows to run (the plugin-pin
  # check, the release fetcher of the security workflow, the weekly digest and
  # its settings, the dependency-audit gate, the parallel-sessions report, each
  # test with its script) and the list of accepted advisories the audit gate
  # reads, the npm config files that decide what that gate audits (a
  # workspace's .npmrc), the scanner configs that decide what gitleaks and
  # zizmor report (both names gitleaks reads, .gitleaks.toml and the
  # .gitleaks.json it would take first; zizmor's at the root and under
  # .github/), the record of which Claude Code plugin commits were reviewed,
  # and the table AM-1 reads; and the
  # findings catalogue at the root (SECURITY_REVIEW*.md), which the automated
  # review reads as its standards; and the convention pages (docs/conventions/),
  # which CLAUDE.md sends every session and the review to.
  # Single source for both jobs; AM-1 (scripts/guards.d/40-auto-merge.sh) tests
  # the pattern on a table of paths and asserts both jobs use it. This is the
  # kit's list: leave it as it is, so an update of the kit can refresh it.
  CLAUDE_GATE_RE: '(^|/)\.claude(/|$)|(^|/)(claude(\.local)?|agents)\.md$|^\.githooks(/|$)|(^|/)\.mcp\.json$|(^|/)\.claude\.json$|(^|/)\.ripgreprc$|(^|/)\.gitmodules$|(^|/)\.husky(/|$)|^\.github/workflows/(auto-merge|claude[^/]*)\.ya?ml$|^(\.github/)?zizmor\.ya?ml$|^\.gitleaks(\.toml|\.json|ignore)$|(^|/)\.npmrc$|^scripts/guards\.d/|^scripts/(security-checks\.sh|fetch-pinned-release\.sh|plugin-pins(\.test)?\.mjs|reviewed-plugins\.json|auto-merge-paths\.txt|weekly-digest(\.test|\.config)?\.mjs|audit-gate(\.test)?\.mjs|audit-allowlist\.json|parallel-sessions\.sh|eco-design-audit(\.test)?\.mjs|eco-design\.config\.json)$|^security_review[^/]*\.md$|^docs/conventions/'
  # The project's own additions to the list above, applied with it by both
  # jobs (same syntax, same matching). `^$` matches no path: nothing is added
  # as shipped. An empty or unusable pattern holds every pull request.
  # Whatever else your tooling executes goes here (another agent's instruction
  # file, a page of install commands that sessions follow, another hooks
  # directory, a script one of your own guards runs), with a `hold` row per
  # path in scripts/auto-merge-paths.txt. The value is a setting of the
  # installation, not an edit of this file: the kit's `update <dir> --set
  # PROJECT_GATE_RE=<pattern>` writes it here and remembers it, so this file
  # stays the kit's and keeps following it.
  PROJECT_GATE_RE: '__HARNESS_PROJECT_GATE_RE__'
  # Tests an unattended merge must not weaken (ERE on paths, matched like the
  # two patterns above). Green means merged, and green is whatever the tests
  # say: a pull request that deletes or renames a file matching this pattern,
  # or removes or rewrites a line of one, is held for a hand merge. A new test
  # file, and lines added to an existing one, keep merging on green. `^$`
  # matches no path: nothing is held as shipped. An unusable pattern holds
  # every pull request that changes an existing file. A tripwire, not a proof:
  # docs/conventions/auto-merge-policy.md § Tests that get weaker.
  # Name the paths of your tests and of their fixtures and snapshots
  # (`(^|/)tests?/|\.(test|spec)\.[a-z]+$`), with `test` rows in
  # scripts/auto-merge-paths.txt. Set like PROJECT_GATE_RE: `update <dir>
  # --set TEST_HOLD_RE=<pattern>`.
  TEST_HOLD_RE: '__HARNESS_TEST_HOLD_RE__'
  # Where a Dependabot major is held even when it is an indirect dependency's
  # security update (ERE on the changed paths; `.github/` is always held).
  # `.` matches every path: as shipped, every Dependabot major waits for a hand
  # merge. Narrow it to the directories whose dependencies the pull-request CI
  # does not build or test (a mobile app, a production image), or to `^$` when
  # CI exercises everything, to let such a fix through unattended elsewhere.
  # An empty or unusable pattern holds everything.
  # Set like PROJECT_GATE_RE: `update <dir> --set MAJOR_HOLD_RE=<pattern>`.
  MAJOR_HOLD_RE: '__HARNESS_MAJOR_HOLD_RE__'

jobs:
  promote-from-ci:
    # workflow_run path: only act on green CI runs that originated from a
    # pull_request inside this same repository (no forks; workflow_run has
    # elevated permissions otherwise). A claude/issue-* head is a branch a CI
    # Claude session wrote, and opening its pull request is not reading it:
    # never unattended.
    # A review run's own head is the default branch: its pull request's head
    # branch is checked in find-pr instead.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'pull_request' || (github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.path == '.github/workflows/claude-review.yml')) &&
      !startsWith(github.event.workflow_run.head_branch, 'claude/issue-') &&
      !startsWith(github.event.workflow_run.head_branch, 'claude/rework-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One run at a time per commit: CI's end and the review's end would
    # otherwise both see two green sign-offs and both try to merge. Keyed on
    # the commit judged, written the way the review names it, so pull requests
    # never wait for each other; a run left pending here and replaced by a
    # newer one loses nothing, the newer one re-reads everything.
    concurrency:
      group: auto-merge-${{ github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.display_title || format('Claude review of {0}', github.event.workflow_run.head_sha) }}
      cancel-in-progress: false
    permissions:
      pull-requests: write # mark ready, merge
      contents: write # merge, delete the head branch
      actions: read # the sign-offs: the runs of CI and of the review
    steps:
      # The commit to judge (AM-6). A CI run started by a pull request carries
      # it as its head. A review run's head is the default branch: the commit
      # it reviewed is in its run name, which only the default branch's file
      # sets (the job's if: accepted the run for that reason).
      - name: Commit to judge
        id: event
        env:
          EVENT: ${{ github.event.workflow_run.event }}
          RUN_HEAD: ${{ github.event.workflow_run.head_sha }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request)
              if ! [[ "$RUN_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::No commit could be read from the triggering run — nothing was decided."
                exit 1
              fi
              SHA=$RUN_HEAD ;;
            workflow_run)
              # A review run that had nothing to review names no commit.
              if ! [[ "$RUN_TITLE" =~ ^Claude\ review\ of\ [0-9a-f]{40}$ ]]; then
                echo "Review run without a commit (${RUN_TITLE:0:80}) — nothing to decide."
                exit 0
              fi
              SHA=${RUN_TITLE#Claude review of } ;;
            *) echo "::error::Unexpected event ${EVENT} — nothing was decided."; exit 1 ;;
          esac
          echo "head_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Find PR for head_sha
        id: find-pr
        if: steps.event.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.event.outputs.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # `sha:` matches any open PR that CONTAINS the commit (a stacked PR,
          # a sibling): keep only the one whose head IS the validated SHA, and
          # only into the default branch — the branch the review and the gate
          # judge against. Two such pull requests are one too many to choose
          # from: a hand merge.
          FOUND=$(gh pr list --search "sha:$HEAD_SHA" --state open --base "$DEFAULT_BRANCH" --json number,headRefOid,headRefName \
                 --jq '[.[] | select(.headRefOid == $ENV.HEAD_SHA) | [.number, .headRefName] | @tsv]')
          COUNT=$(jq 'length' <<< "$FOUND")
          if [ "$COUNT" = "0" ]; then
            echo "No open PR into ${DEFAULT_BRANCH} found for SHA $HEAD_SHA — skipping"
            exit 0
          fi
          if [ "$COUNT" != "1" ]; then
            echo "::notice::${COUNT} open pull requests into ${DEFAULT_BRANCH} have head ${HEAD_SHA:0:7} — leaving them for a hand merge."
            exit 0
          fi
          IFS=$'\t' read -r PR HEAD_REF <<< "$(jq -r '.[0]' <<< "$FOUND")"
          # The job's if: refuses a claude/issue-* or claude/rework-* head for
          # a CI run; a review run's head is the default branch, so the pull
          # request's own head branch is checked here.
          if [[ "$HEAD_REF" == claude/issue-* || "$HEAD_REF" == claude/rework-* ]]; then
            echo "::notice::PR #${PR} comes from ${HEAD_REF}, a branch a CI Claude session wrote — never unattended."
            exit 0
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      # Both sign-offs, whichever workflow started this one (AM-6).
      # CI: every run of a workflow named __HARNESS_CI_WORKFLOW__ for this commit
      # must be green (a flaky run may be re-run). Every run, not the latest: a
      # pull request into another branch can run its own copy of a workflow on
      # the same commit, and a green copy must not cover a red original.
      # The review: when its file is on the default branch, every run of it
      # that names this commit must be green at its first attempt — a hold
      # stays a hold until a new commit, and a review re-run until the model
      # says pass holds too. Review runs are started by workflow_run, so their
      # file is always the default branch's; they are found by the commit their
      # run name carries, among the review's latest 100 runs (an older one is
      # not found, and the pull request waits for a human). A pending one means
      # its own end will start this again. Dependabot's pull requests get no
      # review (it skips them) and keep their own gate below.
      - name: Sign-offs (CI, and the review where there is one)
        id: signoff
        if: steps.find-pr.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.find-pr.outputs.pr }}
          HEAD_SHA: ${{ steps.event.outputs.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CI_NAME: '__HARNESS_CI_WORKFLOW__'
        run: |
          set -euo pipefail
          export REVIEW_PATH=.github/workflows/claude-review.yml
          if OUT=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${REVIEW_PATH}?ref=${DEFAULT_BRANCH}" --jq '.sha' 2>&1); then
            REVIEW=required
          else
            case "$OUT" in
              *"(HTTP 404)"*) REVIEW=none ;;
              *) echo "$OUT"; echo "::error::Could not tell whether ${REVIEW_PATH} exists — nothing was decided. Re-run this job."; exit 1 ;;
            esac
          fi
          AUTHOR=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.user.login') || AUTHOR=""
          if [ -z "$AUTHOR" ]; then
            echo "::error::PR #${PR} could not be read from the API — nothing was decided. Re-run this job."
            exit 1
          fi
          if [ "$AUTHOR" = "dependabot[bot]" ] || [ "$AUTHOR" = "app/dependabot" ] || [ "$AUTHOR" = "dependabot" ]; then
            REVIEW=none
          fi
          CI_RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=100" \
                   --jq '{total: .total_count, runs: [.workflow_runs[] | {name, path: (.path | split("@")[0]), run_number, run_attempt, status, conclusion}]}')
          if [ "$(jq -r '.total' <<< "$CI_RUNS")" -gt 100 ]; then
            echo "::notice::PR #${PR}: more than 100 runs for ${HEAD_SHA:0:7} — leaving it for a hand merge."
            exit 0
          fi
          # >>> signoff_state (AM-6 extracts this block). stdin: the runs; $1: a jq
          # filter selecting the workflow's runs; $2: rerun-ok (every run green,
          # at whatever attempt) or first-attempt (every run green at its first
          # attempt; any other value is as strict). Prints ok, pending, red or none.
          signoff_state() {
            jq -r --arg mode "$2" "[.runs[] | select($1)]
              | if length == 0 then \"none\"
                elif any((\$mode != \"rerun-ok\" and .run_attempt != 1) or (.status == \"completed\" and .conclusion != \"success\")) then \"red\"
                elif all(.status == \"completed\") then \"ok\"
                else \"pending\" end"
          }
          # <<< signoff_state
          CI_STATE=$(signoff_state '.name == $ENV.CI_NAME' rerun-ok <<< "$CI_RUNS")
          REVIEW_STATE=skipped
          if [ "$REVIEW" = required ]; then
            REVIEW_RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/claude-review.yml/runs?event=workflow_run&per_page=100" \
                     --jq '{runs: [.workflow_runs[] | select(.display_title == ("Claude review of " + $ENV.HEAD_SHA)) | {name, path: (.path | split("@")[0]), run_number, run_attempt, status, conclusion}]}')
            REVIEW_STATE=$(signoff_state '.path == $ENV.REVIEW_PATH' first-attempt <<< "$REVIEW_RUNS")
          fi
          echo "PR #${PR} at ${HEAD_SHA:0:7}: CI ${CI_STATE}, review ${REVIEW_STATE}"
          if [ "$CI_STATE" != ok ]; then
            echo "::notice::PR #${PR}: CI is ${CI_STATE} for ${HEAD_SHA:0:7} — not merged."
            exit 0
          fi
          case "$REVIEW_STATE" in
            ok|skipped) echo "ok=true" >> "$GITHUB_OUTPUT" ;;
            pending|none) echo "::notice::PR #${PR}: the review of ${HEAD_SHA:0:7} is not in yet — its end decides." ;;
            *) echo "::notice::PR #${PR}: the automated review held ${HEAD_SHA:0:7} — waiting for a human; read its comment." ;;
          esac

      # Dependabot exception to the "every green PR merges" rule.
      #
      # A Dependabot PR is not written by a maintainer, and nobody reads it
      # before it lands. Patch AND minor bumps go through unattended: reading a
      # minor's diff by hand was never the control, the cooldown in
      # dependabot.yml and the CI are. Every commit must be Dependabot's;
      # dependabot_verdict then pairs each trailer entry, by name, with its
      # `from X to Y` line and holds a major (trailer or pair; below 1.0 a
      # minor, below 0.1 a patch), a move to a pre-release, an unreadable
      # version, a GitHub Action minor (it runs with the workflow's token and
      # secrets), or an entry without its pair. One exception to "a major
      # holds": an entry typed `dependency-type: indirect` is a security update
      # — version updates cover direct dependencies only, AM-5 pins
      # dependabot.yml to that — and its major can be the only fix, so it goes
      # through unless a changed path matches MAJOR_HOLD_RE (every path, as
      # shipped). Cooldown keeps fresh versions out of version updates;
      # security updates skip it upstream, a known flaw wins that one.
      # Non-Dependabot PRs are unaffected: they merge on green.
      #
      # Why not dependabot/fetch-metadata? It resolves the PR from the event
      # context and takes no PR number as input, and workflow_run carries no
      # pull_request payload. The merge has to stay on workflow_run (it must
      # wait for CI), so this step reads the same `updated-dependencies`
      # trailer that action parses out of Dependabot's commit message.
      #
      # Second exception: Claude instruction files (any `.claude/` directory,
      # `CLAUDE.md`, `CLAUDE.local.md`, `AGENTS.md` — Claude Code walks up from
      # its working directory and loads a subdirectory's file when it reads
      # there, so a nested one counts too) steer every session that loads
      # them. A green CI proves nothing about them, so they never merge
      # unattended — the PR stays open for a hand merge.
      - name: Merge gate (Claude config, Dependabot breaking bumps and Action minors)
        id: gate
        if: steps.find-pr.outputs.pr != '' && steps.signoff.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.find-pr.outputs.pr }}
          HEAD_SHA: ${{ steps.event.outputs.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # The gate judges what the merge below will bring in, not what the
          # pull request shows at this instant. The merge is pinned to HEAD_SHA,
          # so files and commits are read from the immutable range between the
          # base branch's tip and HEAD_SHA (compare API): a head or a base moved
          # and put back while this step runs changes nothing to it (AM-7). One
          # read of the pull request gives its base branch, its head, its file
          # count and its author. Any doubt holds: a head that is no longer HEAD_SHA,
          # a listing of 300 files (the most the compare lists), a file count that
          # does not match the range, a commit list cut short.
          # A failed read is an error, never "the head moved": inside
          # `read … <<< "$(…)"` a failing call leaves every variable empty and
          # the job green.
          PR_INFO=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '[.base.ref, .head.sha, .changed_files, .user.login] | @tsv') || PR_INFO=""
          IFS=$'\t' read -r BASE_REF PR_HEAD CHANGED AUTHOR <<< "$PR_INFO"
          if [ -z "$PR_HEAD" ]; then
            echo "::error::PR #${PR} could not be read from the API — nothing was decided and nothing was merged. Re-run this job."
            exit 1
          fi
          if [ "$PR_HEAD" != "$HEAD_SHA" ]; then
            echo "::notice::PR #${PR}: head moved since the validated SHA — left as is, its own run decides."
            exit 0
          fi
          # Reviewed and signed off against the default branch: a pull request
          # retargeted elsewhere since would land a diff nobody judged.
          if [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
            echo "::notice::PR #${PR}: its base is ${BASE_REF}, not ${DEFAULT_BRANCH} — leaving it for a hand merge."
            echo "merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$BASE_REF" =~ ^[A-Za-z0-9._/@+-]+$ && "$HEAD_SHA" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "::notice::PR #${PR}: unreadable base branch or head commit — leaving it for a hand merge."
            echo "merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The range starts at the base branch's tip as it is now, never at
          # the pull request's base.sha: GitHub does not move that one when the
          # branch moves, and the squash below applies the head's changes since
          # its merge base with the current tip. A branch the head had merged,
          # landed on the base branch since, moves that merge base: from the
          # stored base.sha, a held path the merge changes back would not be
          # listed. The tip is read by its full ref, so that no tag of the same
          # name can answer, and an unreadable tip fails the job.
          TIP=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BASE_REF}" --jq '.object.sha') || TIP=""
          if ! [[ "$TIP" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "::error::The tip of ${BASE_REF} could not be read — nothing was decided and nothing was merged. Re-run this job."
            exit 1
          fi
          # The base the range is judged against: the merge step refuses a pull
          # request retargeted since.
          echo "base_ref=${BASE_REF}" >> "$GITHUB_OUTPUT"
          # And the tip it is judged against: before each merge call, the
          # merge step compares it with the tip as it is then.
          echo "tip=${TIP}" >> "$GITHUB_OUTPUT"
          # Each file row carries `previous_filename` too, so a rename OUT of a
          # gated path (CLAUDE.md → docs/legacy.md) is still seen. The compare
          # lists 300 files at most, and the pull request's changed_files may
          # be counted from another merge base than the tip's: equal counts do
          # not prove a whole listing. A listing of 300 files holds whatever
          # the count, and so does any gap between the two.
          RANGE=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${TIP}...${HEAD_SHA}" \
                    --jq '{base: (.merge_base_commit.sha // ""), total: .total_commits, commits: [.commits[] | {login: (.author.login // "unknown"), message: .commit.message}], files: [.files[]? | [.filename, (.previous_filename // "")]], changes: [.files[]? | {filename, previous_filename, status, additions, deletions}]}')
          ROWS=$(jq -r '.files[] | @tsv' <<< "$RANGE")
          LISTED=$(grep -c . <<< "$ROWS" || true)
          if [ "$LISTED" -ge 300 ] || [ "$LISTED" != "$CHANGED" ]; then
            echo "::notice::PR #${PR}: ${LISTED} file(s) listed from the tip of ${BASE_REF}, ${CHANGED} counted on the pull request (a listing of 300 may be cut short; a gap is a merge base the tip moved) — leaving it for a hand merge."
            echo "merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The merge base the range was listed from: what the merge writes is
          # the head's changes since it, so the merge step stops when it moved.
          MB=$(jq -r '.base' <<< "$RANGE")
          if ! [[ "$MB" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "::notice::PR #${PR}: the range from the tip of ${BASE_REF} came back without its merge base — leaving it for a hand merge."
            echo "merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "merge_base=${MB}" >> "$GITHUB_OUTPUT"
          PATHS=$(tr '\t' '\n' <<< "$ROWS" | grep . || true)
          # Per path segment and case-folded: on a case-insensitive file system
          # `.Claude/agents/x.md` lands in `.claude/agents/`; `(/|$)` also
          # catches a `.claude` symlink entry. Patterns: CLAUDE_GATE_RE and
          # PROJECT_GATE_RE (workflow env).
          CLAUDE_FILES=$(grep -i -E -c -e "$CLAUDE_GATE_RE" -e "$PROJECT_GATE_RE" <<< "$PATHS" || true)
          if [ "$CLAUDE_FILES" != "0" ]; then
            echo "::notice::PR #${PR} touches ${CLAUDE_FILES} file(s) matched by CLAUDE_GATE_RE or PROJECT_GATE_RE — never merged unattended, merge it by hand."
            echo "merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Tests that get weaker (AM-8). SHRUNK lists every file of the range
          # that is not new and did more than gain lines — deleted, renamed
          # (old and new path), a line removed or rewritten, or a change with
          # no line count (a binary snapshot, a mode). One of them under
          # TEST_HOLD_RE holds the pull request, whoever wrote it: the CI that
          # just went green ran the tests as this pull request left them.
          SHRUNK=$(jq -r '.changes[] | select(.status != "added" and ((.status == "modified" and .deletions == 0 and .additions > 0) | not)) | .filename, (.previous_filename // empty)' <<< "$RANGE")
          WEAKENED=0
          if [ -n "$SHRUNK" ]; then WEAKENED=$(grep -i -E -c -e "$TEST_HOLD_RE" <<< "$SHRUNK" || true); fi
          if [ "$WEAKENED" != "0" ]; then
            echo "::notice::PR #${PR} deletes, renames or rewrites lines of ${WEAKENED} existing file(s) matched by TEST_HOLD_RE — never merged unattended, read what the tests lost and merge it by hand."
            echo "merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # AUTHOR came with changed_files above (.user.login).
          # Deliberately not a `case` statement: `dependabot[bot]` would be read
          # as a glob character class ([bot] = one char among b, o, t).
          if [ "$AUTHOR" != "dependabot[bot]" ] \
             && [ "$AUTHOR" != "app/dependabot" ] \
             && [ "$AUTHOR" != "dependabot" ]; then
            echo "merge=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # >>> dependabot_verdict (AM-5 extracts this block and runs it on
          # Dependabot commit bodies). stdin: the PR's commit messages; $1: its
          # changed paths. Prints `merge`, or `hold: <reason>`; anything else
          # holds too.
          dependabot_verdict() {
            local msgs entries names direct pairs name from to level held
            msgs=$(cat)
            # One `name dependency-type update-type` per trailer entry ("-" if
            # absent), read only inside the `updated-dependencies:` ... `...` block.
            entries=$(awk '
              /^updated-dependencies:$/ { in_t = 1; next }
              /^\.\.\.$/               { in_t = 0 }
              !in_t { next }
              /^- / { if (n != "") print n, t, u
                      n = ""; t = "-"; u = "-" }
              /^- dependency-name: / { n = $3; gsub(/"/, "", n); next }
              /^  dependency-type: / { t = $2 }
              /^  update-type: /     { u = $2 }
              END { if (n != "") print n, t, u }' <<< "$msgs")
            # Version updates cover direct dependencies only (AM-5 pins
            # dependabot.yml to that), so an indirect entry is a security
            # update: its major is the only route to the fix, and may go through.
            # By name: a package with any entry not typed indirect (direct in
            # one manifest, indirect in another, or untyped) counts as direct.
            direct=$(awk '$2 != "indirect" { print $1 }' <<< "$entries")
            while read -r name; do
              if [ -n "$name" ] && grep -qxF -- "$name" <<< "$direct"; then
                echo "hold: the trailer says semver-major for ${name}"; return
              fi
            done <<< "$(awk '$3 == "version-update:semver-major" { print $1 }' <<< "$entries")"
            # One `name from to` per bump line: "Bumps [pkg](url) from A to B."
            # (most ecosystems), "Bumps pkg from A to B." (docker), "Updates
            # `pkg` from A to B" (group).
            pairs=$(grep -E '^(Bumps|Updates) ' <<< "$msgs" | sed -E 's/\.$//' | sed -nE \
                      -e 's/^Bumps \[([^]]+)\]\([^)]*\) from ([^ ]+) to ([^ ]+)$/\1 \2 \3/p' \
                      -e 's/^Bumps ([^ []+) from ([^ ]+) to ([^ ]+)$/\1 \2 \3/p' \
                      -e 's/^Updates `([^`]+)` from ([^ ]+) to ([^ ]+)$/\1 \2 \3/p' || true)
            # Every trailer entry, by name, must have its pair: a bump written in
            # another shape would otherwise go unchecked.
            names=$(cut -d' ' -f1 <<< "$entries" | grep . | sort -u || true)
            if [ -z "$names" ] || [ "$(cut -d' ' -f1 <<< "$pairs" | sort -u)" != "$names" ]; then
              echo "hold: the version pairs do not match the trailer entries"; return
            fi
            while read -r name from to; do
              level=$(bump_level "$from" "$to")
              case "$level" in
                patch) ;;
                # An Action runs with the workflow's token and secrets.
                minor) if grep -q '^\.github/' <<< "$1"; then
                         echo "hold: minor bump of the GitHub Action ${name}"; return
                       fi ;;
                # A direct dependency always holds. An indirect one holds where
                # MAJOR_HOLD_RE says the PR's CI does not exercise what ships,
                # and under .github/. Only "no path matched" (1) lets it
                # through: a match (0), an unusable pattern (2) or an empty
                # path list holds.
                major) held=0
                       if [ -n "$1" ]; then grep -qE "^\.github/|${MAJOR_HOLD_RE:-.}" <<< "$1" || held=$?; fi
                       if [ "$held" != 1 ] || grep -qxF -- "$name" <<< "$direct"; then
                         echo "hold: major bump of ${name}: ${from} -> ${to}"; return
                       fi ;;
                *) echo "hold: ${level} bump of ${name}: ${from} -> ${to}"; return ;;
              esac
            done <<< "$pairs"
            echo merge
          }
          # patch | minor | major (a different major; below 1.0 a different
          # minor, below 0.1 a different patch: breaking by semver) | prerelease
          # (TO carries a suffix FROM does not) | bad (not a whole version token:
          # a SHA, a digest, an empty field).
          bump_level() {
            local re='^v?([0-9]+)(\.([0-9]+))?(\.([0-9]+))?(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$' f t
            [[ "$1" =~ $re ]] || { echo bad; return; }
            f=("${BASH_REMATCH[1]}" "${BASH_REMATCH[3]:-0}" "${BASH_REMATCH[5]:-0}" "${BASH_REMATCH[6]}")
            [[ "$2" =~ $re ]] || { echo bad; return; }
            t=("${BASH_REMATCH[1]}" "${BASH_REMATCH[3]:-0}" "${BASH_REMATCH[5]:-0}" "${BASH_REMATCH[6]}")
            if [ -n "${t[3]}" ] && [ "${t[3]}" != "${f[3]}" ]; then echo prerelease
            elif [ "${f[0]}" != "${t[0]}" ]; then echo major
            elif [ "${f[0]}" = 0 ] && [ "${f[1]}" != "${t[1]}" ]; then echo major
            elif [ "${f[0]}" = 0 ] && [ "${f[1]}" = 0 ] && [ "${f[2]}" != "${t[2]}" ]; then echo major
            elif [ "${f[1]}" != "${t[1]}" ]; then echo minor
            else echo patch
            fi
          }
          # <<< dependabot_verdict

          # Every commit must be Dependabot's: a commit pushed onto its branch
          # would otherwise ride this exception unreviewed. The commits are
          # those of the same immutable range; a list cut short (the compare
          # returns 250 commits at most) holds.
          if [ "$(jq -r '.total' <<< "$RANGE")" != "$(jq -r '.commits | length' <<< "$RANGE")" ]; then
            echo "::notice::PR #${PR} (Dependabot): commit list incomplete — leaving it for a hand merge."
            echo "merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AUTHORS=$(jq -r '.commits[].login' <<< "$RANGE")
          if grep -qvxF 'dependabot[bot]' <<< "$AUTHORS"; then
            echo "::notice::PR #${PR} (Dependabot): a commit not authored by Dependabot — leaving it for a hand merge."
            echo "merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MSGS=$(jq -r '.commits[].message' <<< "$RANGE")
          VERDICT=$(dependabot_verdict "$PATHS" <<< "$MSGS")
          if [ "$VERDICT" != merge ]; then
            echo "::notice::PR #${PR} (Dependabot): ${VERDICT#hold: } — leaving it for a hand merge."
            echo "merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice::PR #${PR} (Dependabot): patch/minor, or an indirect dependency's major — auto-merging."
          echo "merge=true" >> "$GITHUB_OUTPUT"

      # Lift draft once the gate has decided, and only while the head is still
      # the one CI validated. merge=true: the merge below needs it (the API
      # refuses drafts). merge=false (held, green CI): the PR now waits only for
      # its hand merge, so the merge button must work — draft never pauses
      # anything here, a held draft would only cost a click. This step never
      # merges (AM-4).
      - name: Mark ready (validated head only, never merges)
        if: steps.find-pr.outputs.pr != '' && steps.gate.outputs.merge != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.find-pr.outputs.pr }}
          HEAD_SHA: ${{ steps.event.outputs.head_sha }}
        run: |
          set -euo pipefail
          HEAD=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          if [ "$HEAD" != "$HEAD_SHA" ]; then
            echo "::notice::PR #${PR}: head moved since the validated SHA — left as is, its own run decides."
            exit 0
          fi
          gh pr ready "$PR" || echo "::warning::PR #${PR}: could not mark it ready — lift draft by hand."

      - name: Squash-merge
        id: merge
        if: steps.find-pr.outputs.pr != '' && steps.gate.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.find-pr.outputs.pr }}
          HEAD_SHA: ${{ steps.event.outputs.head_sha }}
          BASE_REF: ${{ steps.gate.outputs.base_ref }}
          GATE_TIP: ${{ steps.gate.outputs.tip }}
          GATE_MB: ${{ steps.gate.outputs.merge_base }}
        run: |
          set -euo pipefail
          # Server-side merge via REST API — no local git needed. Try
          # --squash first (cleanest linear history); make a merge commit only
          # when GitHub refuses squash as a method (disabled in the repository
          # settings). Any other failure is retried with squash (e.g. "Pull
          # request is in draft state" race right after the ready step above),
          # after the reads below. `sha=` pins the merge to the head CI
          # validated (AM-6): a head pushed since gets a 409 and no merge — the
          # next green run merges it. `merged=true` is what lets the head-branch
          # cleanup below run: only an actual merge sets it; `sha` (the merge
          # commit GitHub created) is what the next step reads, and what a
          # post-merge dispatch would use.
          for attempt in 1 2 3 4 5; do
            for method in squash merge; do
              # Before each call, retries included (AM-7). The pull request:
              # merged already by this workflow's token — an earlier call that
              # answered an error — its merge commit goes to the check that
              # follows; merged by hand, it is not this run's merge; closed
              # without a merge, retargeted since the gate, or with a head
              # pushed since the validated commit, it stops. Each field read is
              # a word, "-" when GitHub sends none: split on tabs, an empty one
              # would shift the next ones, and a merge commit GitHub does not
              # name reaches the check as "-", which it refuses. Then the merge
              # base: the tip moves with every merge, while what this merge
              # writes is the head's changes since its merge base with the tip,
              # which moves when a commit of the head lands. Unchanged, the
              # merge goes on; moved, it stops and a re-run judges it again. A
              # rename the base branch made can still carry a change elsewhere,
              # and the API pins the head of a merge, not its base: the check
              # after the merge sees both (docs/conventions/auto-merge-policy.md
              # § Residual risks).
              STATE=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '[.state, .head.sha, .base.ref, .merged, .merge_commit_sha, .merged_by.login] | map(if . == null or . == "" then "-" else tostring end) | @tsv') || STATE=""
              if [ -z "$STATE" ]; then
                echo "::error::PR #${PR} could not be read again before a merge call. Check whether it is merged: if not, re-run this job; if it is (an earlier call can merge and answer an error), read its merge commit — a re-run does not check it."
                exit 1
              fi
              IFS=$'\t' read -r NOW_STATE NOW_HEAD NOW_BASE NOW_MERGED NOW_COMMIT NOW_BY <<< "$STATE"
              if [ "$NOW_MERGED" = "true" ]; then
                if [ "$NOW_BY" != "github-actions[bot]" ]; then
                  echo "::notice::PR #${PR} was merged by hand meanwhile: not this run's merge, so nothing is checked or cleaned up here."
                  exit 0
                fi
                echo "::notice::PR #${PR} is merged already, by this workflow's token: an earlier call merged it and answered an error. Its merge commit is checked next."
                echo "merged=true" >> "$GITHUB_OUTPUT"
                echo "sha=${NOW_COMMIT}" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "$NOW_STATE" = "closed" ]; then
                echo "::notice::PR #${PR} was closed meanwhile, not merged — left as it is."
                exit 0
              fi
              if [ -z "$BASE_REF" ] || [ "$NOW_BASE" != "$BASE_REF" ]; then
                echo "::notice::PR #${PR}: its base branch changed since the gate — leaving it for a hand merge."
                exit 0
              fi
              # A head pushed since the validated commit is left to its own
              # run, as a 409 would leave it: what follows reads the merge base
              # of the judged head only. After a call that answered a 5xx or
              # nothing (CALLED, set below), red instead: that call may have
              # merged, and the pull request can show it late.
              if [ "$NOW_HEAD" != "$HEAD_SHA" ]; then
                if [ -n "${CALLED:-}" ]; then
                  echo "::error::PR #${PR}: head moved since the validated SHA, after a merge call that answered an error — such a call can merge, and the pull request can show it late. Check whether it is merged: if github-actions[bot] merged it, read its merge commit — a re-run does not check it; if not, its new head gets its own run."
                  exit 1
                fi
                echo "::notice::PR #${PR}: head moved since the validated SHA — leaving it to its own run."
                exit 0
              fi
              NOW_TIP=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BASE_REF}" --jq '.object.sha') || NOW_TIP=""
              if ! [[ "$NOW_TIP" =~ ^[0-9a-f]{40,64}$ ]]; then
                echo "::error::The tip of ${BASE_REF} could not be read again. Check whether PR #${PR} is merged: if not, re-run this job; if it is (an earlier call can merge and answer an error), read its merge commit — a re-run does not check it."
                exit 1
              fi
              if [ "$NOW_TIP" != "$GATE_TIP" ]; then
                NOW_MB=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${NOW_TIP}...${HEAD_SHA}" --jq '.merge_base_commit.sha // ""') || NOW_MB=""
                if ! [[ "$NOW_MB" =~ ^[0-9a-f]{40,64}$ ]]; then
                  echo "::error::The merge base of PR #${PR} with the tip of ${BASE_REF} could not be read. Check whether the pull request is merged: if not, re-run this job; if it is (an earlier call can merge and answer an error), read its merge commit — a re-run does not check it."
                  exit 1
                fi
                # The head on the base branch already: a merge commit of this
                # pull request landed — an earlier call that answered an error
                # — and the pull request does not say so yet. No other call:
                # the next read, or the one after the last call, hands it over.
                if [ "$NOW_MB" = "$HEAD_SHA" ]; then continue; fi
                if [ "$NOW_MB" != "$GATE_MB" ]; then
                  echo "::notice::PR #${PR}: ${BASE_REF} gained a commit of its head since the gate judged it, which changes what the merge would write — not merged. Re-run this workflow to judge it again, or merge it by hand."
                  exit 0
                fi
              fi
              if OUT=$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR}/merge" \
                  -f merge_method="$method" -f sha="$HEAD_SHA" 2>&1); then
                echo "$OUT"
                echo "merged via ${method}"
                echo "merged=true" >> "$GITHUB_OUTPUT"
                echo "sha=$(jq -r '.sha // empty' <<< "$OUT")" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "$OUT"
              # 409 = the head moved since this SHA: the PR is no longer ours
              # to merge, its new head gets its own run. No retry; red after a
              # call that may have merged (CALLED), as the read above is.
              case "$OUT" in
                *"(HTTP 409)"*)
                  if [ -n "${CALLED:-}" ]; then
                    echo "::error::PR #${PR}: head moved since the validated SHA, after a merge call that answered an error — such a call can merge, and the pull request can show it late. Check whether it is merged: if github-actions[bot] merged it, read its merge commit — a re-run does not check it; if not, its new head gets its own run."
                    exit 1
                  fi
                  echo "::notice::PR #${PR}: head moved since the validated SHA — leaving it to its own run."
                  exit 0 ;;
              esac
              # A refusal (an HTTP 4xx answer) merged nothing; any other failure
              # (a 5xx, no answer at all) may have merged.
              case "$OUT" in
                *"(HTTP 4"[0-9][0-9]")"*) ;;
                *) CALLED=1 ;;
              esac
              # A merge commit only when GitHub refuses squash as a method (the
              # repository does not allow it); after any other failure, the next
              # attempt reads everything again and tries squash again.
              if [ "$method" = squash ]; then
                case "$OUT" in
                  *"Squash merges are not allowed"*) ;;
                  *) break ;;
                esac
              fi
            done
            echo "attempt ${attempt}: merge failed, retrying in ${attempt}s"
            sleep "$attempt"
          done
          # The last call can merge and answer an error too: the pull request is
          # read once more before the run is called failed. Merged by anyone else,
          # closed, or its head pushed since, it ends as it would before a call.
          STATE=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '[.state, .head.sha, .base.ref, .merged, .merge_commit_sha, .merged_by.login] | map(if . == null or . == "" then "-" else tostring end) | @tsv') || STATE=""
          if [ -z "$STATE" ]; then
            echo "::error::PR #${PR} could not be read after the last merge call. Check whether it is merged: if it is, read its merge commit — a re-run does not check it."
            exit 1
          fi
          IFS=$'\t' read -r NOW_STATE NOW_HEAD NOW_BASE NOW_MERGED NOW_COMMIT NOW_BY <<< "$STATE"
          if [ "$NOW_MERGED" = "true" ] && [ "$NOW_BY" = "github-actions[bot]" ]; then
            echo "::notice::PR #${PR} is merged, by this workflow's token: the last call merged it and answered an error. Its merge commit is checked next."
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "sha=${NOW_COMMIT}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$NOW_MERGED" = "true" ]; then
            echo "::notice::PR #${PR} was merged by hand meanwhile: not this run's merge, so nothing is checked or cleaned up here."
            exit 0
          fi
          if [ "$NOW_STATE" = "closed" ]; then
            echo "::notice::PR #${PR} was closed meanwhile, not merged — left as it is."
            exit 0
          fi
          if [ "$NOW_HEAD" != "$HEAD_SHA" ]; then
            if [ -n "${CALLED:-}" ]; then
              echo "::error::PR #${PR}: head moved since the validated SHA, after a merge call that answered an error — such a call can merge, and the pull request can show it late. Check whether it is merged: if github-actions[bot] merged it, read its merge commit — a re-run does not check it; if not, its new head gets its own run."
              exit 1
            fi
            echo "::notice::PR #${PR}: head moved since the validated SHA — leaving it to its own run."
            exit 0
          fi
          echo "::error::PR #${PR} is not shown merged by this workflow after its last merge call. A call can merge and answer an error, and the pull request can show it late: check whether it is merged. If github-actions[bot] merged it, read its merge commit — a re-run does not check it; if a person did, nothing is left to do here; if it is not merged, merge it by hand."
          exit 1

      # What the merge wrote, judged again by the gate's rules (AM-10). The
      # gate listed compare/<tip>...<head>, the changes since ONE merge base of
      # the two; the merge wrote what GitHub's merge engine computed. They
      # agree when that engine starts from the same merge base, as it did when
      # this was tried live with two merge bases; nothing documents it, and a
      # branch landing between the last read of the tip and the merge call
      # moves that merge base too. So the merge commit is listed and judged
      # after the fact: red when it wrote something the gate holds.
      # `!cancelled()` keeps it running whatever failed before, since the
      # merge did happen.
      - name: Check what the merge wrote
        id: check
        if: ${{ !cancelled() && steps.merge.outputs.merged == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.find-pr.outputs.pr }}
          MERGED: ${{ steps.merge.outputs.sha }}
          DOCS_ONLY: 'false'
        run: |
          set -euo pipefail
          # The commit the merge created, listed against its first parent: the
          # tip it landed on, whichever it was at that instant. What the gate
          # holds must not be in it. Every failure is red, never a pass: the
          # merge is done, so there is nothing left to hold, only to report.
          if ! [[ "$MERGED" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "::error::PR #${PR} was merged, but GitHub did not name the commit it created — read by hand what the merge changed on the base branch."
            exit 1
          fi
          # A commit just written can take a moment to be readable: three
          # reads, five and ten seconds apart, before calling it unreadable.
          PARENT=""
          for delay in 0 5 10; do
            sleep "$delay"
            PARENT=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${MERGED}" --jq '.parents[0].sha // ""') || PARENT=""
            if [[ "$PARENT" =~ ^[0-9a-f]{40,64}$ ]]; then break; fi
          done
          if ! [[ "$PARENT" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "::error::The commit that merged PR #${PR} (${MERGED:0:7}) could not be read — read by hand what it changed."
            exit 1
          fi
          WROTE=""
          for delay in 0 5 10; do
            sleep "$delay"
            WROTE=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${PARENT}...${MERGED}" \
                      --jq '{listed: (.files | type), files: [.files[]? | [.filename, (.previous_filename // "")]], changes: [.files[]? | {filename, previous_filename, status, additions, deletions}]}') || WROTE=""
            if [ -n "$WROTE" ] && [ "$(jq -r '.listed' <<< "$WROTE")" = "array" ]; then break; fi
          done
          if [ -z "$WROTE" ] || [ "$(jq -r '.listed' <<< "$WROTE")" != "array" ]; then
            echo "::error::What ${MERGED:0:7} changed could not be listed — read by hand what the merge of PR #${PR} changed."
            exit 1
          fi
          WROTE_ROWS=$(jq -r '.files[] | @tsv' <<< "$WROTE")
          WROTE_COUNT=$(grep -c . <<< "$WROTE_ROWS" || true)
          WROTE_PATHS=$(tr '\t' '\n' <<< "$WROTE_ROWS" | grep . || true)
          # The gate's own rules on what landed: a path CLAUDE_GATE_RE or
          # PROJECT_GATE_RE holds, a test weakened under TEST_HOLD_RE (the
          # gate's selection, AM-8) and, after a docs-only merge, a file outside
          # the docs. A listing of 300 files may be cut short: red as well.
          HELD=0
          NON_DOCS=0
          if [ -n "$WROTE_PATHS" ]; then
            HELD=$(grep -i -E -c -e "$CLAUDE_GATE_RE" -e "$PROJECT_GATE_RE" <<< "$WROTE_PATHS" || true)
            if [ "$DOCS_ONLY" = "true" ]; then NON_DOCS=$(grep -E -v -c '(\.md$|^docs/|^LICENSE$|^\.gitignore$)' <<< "$WROTE_PATHS" || true); fi
          fi
          WROTE_SHRUNK=$(jq -r '.changes[] | select(.status != "added" and ((.status == "modified" and .deletions == 0 and .additions > 0) | not)) | .filename, (.previous_filename // empty)' <<< "$WROTE")
          WEAKENED=0
          if [ -n "$WROTE_SHRUNK" ]; then WEAKENED=$(grep -i -E -c -e "$TEST_HOLD_RE" <<< "$WROTE_SHRUNK" || true); fi
          if [ "$WROTE_COUNT" -ge 300 ] || [ "$HELD" != "0" ] || [ "$WEAKENED" != "0" ] || [ "$NON_DOCS" != "0" ]; then
            echo "::error::PR #${PR} was merged as ${MERGED:0:7}, which changed ${WROTE_COUNT} file(s) (at 300 the listing may be cut short): ${HELD} held by CLAUDE_GATE_RE or PROJECT_GATE_RE, ${WEAKENED} weakened under TEST_HOLD_RE, ${NON_DOCS} outside the docs after a docs-only merge. The gate judged none of this: read that commit and revert what nobody reviewed. A re-run of this job ends green without checking again (docs/conventions/auto-merge-policy.md § Residual risks)."
            exit 1
          fi
          echo "PR #${PR}: ${MERGED:0:7} changed ${WROTE_COUNT} file(s), none that the gate holds."

      # Nothing is dispatched after the merge (see the header). If a deploy or
      # a test run must follow it, the dispatch goes here: after the check
      # above, never when it is red (`steps.check.outcome == 'success'` in its
      # `if`), before the branch cleanup, with what
      # docs/conventions/auto-merge-policy.md § After the merge lists. That is
      # an edit of this file: from then on `update` no longer refreshes it by
      # itself, and `update --merge` carries the edit over a new version of the
      # kit.

      # Delete the head ref ourselves (see the header). `!cancelled()` keeps it
      # running when a step added between the merge and here failed, since the
      # merge did happen. Each guard below is explained once, in
      # docs/conventions/auto-merge-policy.md § Head branch deletion.
      - name: Delete head branch
        if: ${{ !cancelled() && steps.merge.outputs.merged == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.find-pr.outputs.pr }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          INFO=$(gh pr view "$PR" --json headRefName,headRefOid,isCrossRepository \
            --jq '[.headRefName, .headRefOid, .isCrossRepository] | @tsv')
          IFS=$'\t' read -r HEAD_REF MERGED_OID CROSS_REPO <<< "$INFO"
          if [ "$CROSS_REPO" != "false" ]; then
            echo "PR #${PR}: head branch lives in another repository — nothing to delete here."
            exit 0
          fi
          if [ "$HEAD_REF" = "$DEFAULT_BRANCH" ]; then
            echo "::warning::PR #${PR}: head branch is the default branch — not deleting."
            exit 0
          fi
          # Stacked on top of it, or opened from it: deleting would retarget
          # or close that PR behind its author's back.
          OPEN_ON_TOP=$(gh pr list --state open --base "$HEAD_REF" --json number --jq 'length')
          OPEN_FROM=$(gh pr list --state open --head "$HEAD_REF" --json number --jq 'length')
          if [ "$OPEN_ON_TOP" != "0" ] || [ "$OPEN_FROM" != "0" ]; then
            echo "::notice::PR #${PR}: other open PR(s) still use the head branch (${OPEN_ON_TOP} on top of it, ${OPEN_FROM} from it) — keeping it."
            exit 0
          fi
          if ! [[ "$HEAD_REF" =~ ^[A-Za-z0-9._/@+-]+$ ]]; then
            echo "::warning::PR #${PR}: head branch name needs URL encoding — delete it by hand."
            exit 0
          fi
          # Exact lookup first: "gone" = already deleted (Dependabot, a human)
          # = goal reached. The REST `GET git/ref/…` would need its status
          # line parsed to tell a 404 from an outage; a failed lookup fails.
          CURRENT_OID=$(gh api graphql \
            -f query='query($owner: String!, $name: String!, $ref: String!) { repository(owner: $owner, name: $name) { ref(qualifiedName: $ref) { target { oid } } } }' \
            -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -f ref="refs/heads/${HEAD_REF}" \
            --jq '.data.repository.ref.target.oid // "gone"') \
            || { echo "::error::Could not look up head branch '${HEAD_REF}' of #${PR} — check it by hand."; exit 1; }
          if [ "$CURRENT_OID" = "gone" ]; then
            echo "${HEAD_REF} was already deleted"
            exit 0
          fi
          # A commit pushed since the merge must survive.
          if [ "$CURRENT_OID" != "$MERGED_OID" ]; then
            echo "::warning::PR #${PR}: head branch moved since the merge (${CURRENT_OID:0:7} vs merged ${MERGED_OID:0:7}) — not deleting."
            exit 0
          fi
          if gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${HEAD_REF}"; then
            echo "deleted ${HEAD_REF}"
            exit 0
          fi
          echo "::error::Could not delete head branch '${HEAD_REF}' of #${PR} — delete it by hand."
          exit 1

  promote-docs:
    # pull_request path: docs-only changes the CI workflow deliberately skips.
    # They have no status check to wait for, so they merge immediately. Fork
    # guard mirrors workflow_run's repo-ownership check, and the claude/issue-*
    # refusal.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'claude/issue-') &&
      !startsWith(github.event.pull_request.head.ref, 'claude/rework-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write # mark ready, merge
      contents: write # merge, delete the head branch
    steps:
      - name: Mark ready + squash-merge
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # GitHub's pull_request `paths` filter matches when ANY changed file
          # matches, so a MIXED docs+code PR reaches this job too. Merging here
          # would bypass the CI workflow entirely (the known race: a mixed PR
          # merged before its CI finished). Only merge when EVERY changed file
          # is docs; otherwise leave it to promote-from-ci, which waits for the
          # CI verdict. The path set mirrors the CI workflow's paths-ignore and
          # this workflow's pull_request paths.
          # Claude instruction files (`.claude/**`, `CLAUDE.md`) are `.md` too
          # but never merge unattended (see promote-from-ci's gate): no CI runs
          # on them either, so such a PR waits for a hand merge.
          # Same listing and gate as promote-from-ci (comments there): the
          # immutable range from the base branch's tip, read by its full ref,
          # to the head this event carries, never the pull request's current
          # files nor the event's base.sha; a head or a base that is no longer
          # the event's holds.
          # A failed read is an error, not a changed head (see promote-from-ci).
          PR_INFO=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '[.base.ref, .head.sha, .changed_files] | @tsv') || PR_INFO=""
          IFS=$'\t' read -r NOW_BASE PR_HEAD CHANGED <<< "$PR_INFO"
          if [ -z "$PR_HEAD" ]; then
            echo "::error::PR #${PR} could not be read from the API — nothing was decided and nothing was merged. Re-run this job."
            exit 1
          fi
          if [ "$PR_HEAD" != "$HEAD_SHA" ] || [ "$NOW_BASE" != "$BASE_REF" ]; then
            echo "::notice::PR #${PR}: head or base changed since this event — left as is."
            exit 0
          fi
          if ! [[ "$BASE_REF" =~ ^[A-Za-z0-9._/@+-]+$ && "$HEAD_SHA" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "::notice::PR #${PR}: unreadable base branch or head commit — leaving it for a hand merge."
            exit 0
          fi
          TIP=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BASE_REF}" --jq '.object.sha') || TIP=""
          if ! [[ "$TIP" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "::error::The tip of ${BASE_REF} could not be read — nothing was decided and nothing was merged. Re-run this job."
            exit 1
          fi
          RANGE=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${TIP}...${HEAD_SHA}" \
                    --jq '{base: (.merge_base_commit.sha // ""), files: [.files[]? | [.filename, (.previous_filename // "")]], changes: [.files[]? | {filename, previous_filename, status, additions, deletions}]}')
          ROWS=$(jq -r '.files[] | @tsv' <<< "$RANGE")
          LISTED=$(grep -c . <<< "$ROWS" || true)
          if [ "$LISTED" -ge 300 ] || [ "$LISTED" != "$CHANGED" ]; then
            echo "::notice::PR #${PR}: ${LISTED} file(s) listed from the tip of ${BASE_REF}, ${CHANGED} counted on the pull request (a listing of 300 may be cut short; a gap is a merge base the tip moved) — leaving it for a hand merge."
            exit 0
          fi
          # The merge base the range was listed from (see promote-from-ci).
          MB=$(jq -r '.base' <<< "$RANGE")
          if ! [[ "$MB" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "::notice::PR #${PR}: the range from the tip of ${BASE_REF} came back without its merge base — leaving it for a hand merge."
            exit 0
          fi
          PATHS=$(tr '\t' '\n' <<< "$ROWS" | grep . || true)
          # Old AND new paths count: a rename out of code into docs/ is a code
          # change (the code file disappears) and must go through CI.
          NON_DOCS=$(grep -E -v -c '(\.md$|^docs/|^LICENSE$|^\.gitignore$)' <<< "$PATHS" || true)
          CLAUDE_FILES=$(grep -i -E -c -e "$CLAUDE_GATE_RE" -e "$PROJECT_GATE_RE" <<< "$PATHS" || true)
          if [ "$CLAUDE_FILES" != "0" ]; then
            echo "::notice::PR #${PR} touches ${CLAUDE_FILES} file(s) matched by CLAUDE_GATE_RE or PROJECT_GATE_RE — never merged unattended, merge it by hand."
            # Docs-only: no CI will run, so this is its hold point — hand it
            # over (see promote-from-ci). A PR with code stays draft until its
            # CI is green, where promote-from-ci hands it over.
            if [ "$NON_DOCS" = "0" ]; then gh pr ready "$PR" || echo "::warning::PR #${PR}: could not mark it ready — lift draft by hand."; fi
            exit 0
          fi
          if [ "$NON_DOCS" != "0" ]; then
            echo "PR #${PR} touches ${NON_DOCS} non-docs file(s) — deferring to the CI gate (promote-from-ci)."
            exit 0
          fi
          # Tests that get weaker (AM-8, see promote-from-ci): a test or a
          # fixture kept as documentation is held here too. It stays a draft:
          # the one line that marks a pull request ready in this job is the
          # gate's above (AM-4).
          SHRUNK=$(jq -r '.changes[] | select(.status != "added" and ((.status == "modified" and .deletions == 0 and .additions > 0) | not)) | .filename, (.previous_filename // empty)' <<< "$RANGE")
          WEAKENED=0
          if [ -n "$SHRUNK" ]; then WEAKENED=$(grep -i -E -c -e "$TEST_HOLD_RE" <<< "$SHRUNK" || true); fi
          if [ "$WEAKENED" != "0" ]; then
            echo "::notice::PR #${PR} deletes, renames or rewrites lines of ${WEAKENED} existing file(s) matched by TEST_HOLD_RE — never merged unattended, lift draft and merge it by hand."
            exit 0
          fi
          gh pr ready "$PR" || true
          # `sha=` pins the merge to the head this event carries (a head pushed
          # since gets a 409 and its own run). `merged=true` only on an actual
          # merge: the deferral above and a failed merge leave it unset, so the
          # check and the branch cleanup below are skipped. `sha` is the merge
          # commit, which the check reads.
          for attempt in 1 2 3 4 5; do
            for method in squash merge; do
              # The pull request (its state, head and base) and the merge base,
              # read again before each call (see promote-from-ci).
              STATE=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '[.state, .head.sha, .base.ref, .merged, .merge_commit_sha, .merged_by.login] | map(if . == null or . == "" then "-" else tostring end) | @tsv') || STATE=""
              if [ -z "$STATE" ]; then
                echo "::error::PR #${PR} could not be read again before a merge call. Check whether it is merged: if not, re-run this job; if it is (an earlier call can merge and answer an error), read its merge commit — a re-run does not check it."
                exit 1
              fi
              IFS=$'\t' read -r NOW_STATE NOW_HEAD NOW_BASE NOW_MERGED NOW_COMMIT NOW_BY <<< "$STATE"
              if [ "$NOW_MERGED" = "true" ]; then
                if [ "$NOW_BY" != "github-actions[bot]" ]; then
                  echo "::notice::PR #${PR} was merged by hand meanwhile: not this run's merge, so nothing is checked or cleaned up here."
                  exit 0
                fi
                echo "::notice::PR #${PR} is merged already, by this workflow's token: an earlier call merged it and answered an error. Its merge commit is checked next."
                echo "merged=true" >> "$GITHUB_OUTPUT"
                echo "sha=${NOW_COMMIT}" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "$NOW_STATE" = "closed" ]; then
                echo "::notice::PR #${PR} was closed meanwhile, not merged — left as it is."
                exit 0
              fi
              if [ -z "$BASE_REF" ] || [ "$NOW_BASE" != "$BASE_REF" ]; then
                echo "::notice::PR #${PR}: its base branch changed since the gate — leaving it for a hand merge."
                exit 0
              fi
              # A head pushed since the validated commit is left to its own
              # run; red after a call that may have merged (see promote-from-ci).
              if [ "$NOW_HEAD" != "$HEAD_SHA" ]; then
                if [ -n "${CALLED:-}" ]; then
                  echo "::error::PR #${PR}: head moved since the validated SHA, after a merge call that answered an error — such a call can merge, and the pull request can show it late. Check whether it is merged: if github-actions[bot] merged it, read its merge commit — a re-run does not check it; if not, its new head gets its own run."
                  exit 1
                fi
                echo "::notice::PR #${PR}: head moved since the validated SHA — leaving it to its own run."
                exit 0
              fi
              NOW_TIP=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BASE_REF}" --jq '.object.sha') || NOW_TIP=""
              if ! [[ "$NOW_TIP" =~ ^[0-9a-f]{40,64}$ ]]; then
                echo "::error::The tip of ${BASE_REF} could not be read again. Check whether PR #${PR} is merged: if not, re-run this job; if it is (an earlier call can merge and answer an error), read its merge commit — a re-run does not check it."
                exit 1
              fi
              if [ "$NOW_TIP" != "$TIP" ]; then
                NOW_MB=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${NOW_TIP}...${HEAD_SHA}" --jq '.merge_base_commit.sha // ""') || NOW_MB=""
                if ! [[ "$NOW_MB" =~ ^[0-9a-f]{40,64}$ ]]; then
                  echo "::error::The merge base of PR #${PR} with the tip of ${BASE_REF} could not be read. Check whether the pull request is merged: if not, re-run this job; if it is (an earlier call can merge and answer an error), read its merge commit — a re-run does not check it."
                  exit 1
                fi
                # The head on the base branch already: a merge commit of this
                # pull request landed — an earlier call that answered an error
                # — and the pull request does not say so yet. No other call:
                # the next read, or the one after the last call, hands it over.
                if [ "$NOW_MB" = "$HEAD_SHA" ]; then continue; fi
                if [ "$NOW_MB" != "$MB" ]; then
                  echo "::notice::PR #${PR}: ${BASE_REF} gained a commit of its head since the gate judged it, which changes what the merge would write — not merged. Re-run this workflow to judge it again, or merge it by hand."
                  exit 0
                fi
              fi
              if OUT=$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR}/merge" \
                  -f merge_method="$method" -f sha="$HEAD_SHA" 2>&1); then
                echo "$OUT"
                echo "merged via ${method}"
                echo "merged=true" >> "$GITHUB_OUTPUT"
                echo "sha=$(jq -r '.sha // empty' <<< "$OUT")" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "$OUT"
              # 409 = the head moved since this SHA: the PR is no longer ours
              # to merge, its new head gets its own run. No retry; red after a
              # call that may have merged (see promote-from-ci).
              case "$OUT" in
                *"(HTTP 409)"*)
                  if [ -n "${CALLED:-}" ]; then
                    echo "::error::PR #${PR}: head moved since the validated SHA, after a merge call that answered an error — such a call can merge, and the pull request can show it late. Check whether it is merged: if github-actions[bot] merged it, read its merge commit — a re-run does not check it; if not, its new head gets its own run."
                    exit 1
                  fi
                  echo "::notice::PR #${PR}: head moved since the validated SHA — leaving it to its own run."
                  exit 0 ;;
              esac
              # A refusal (an HTTP 4xx answer) merged nothing; any other failure
              # (a 5xx, no answer at all) may have merged.
              case "$OUT" in
                *"(HTTP 4"[0-9][0-9]")"*) ;;
                *) CALLED=1 ;;
              esac
              # A merge commit only when GitHub refuses squash as a method (the
              # repository does not allow it); after any other failure, the next
              # attempt reads everything again and tries squash again.
              if [ "$method" = squash ]; then
                case "$OUT" in
                  *"Squash merges are not allowed"*) ;;
                  *) break ;;
                esac
              fi
            done
            echo "attempt ${attempt}: merge failed, retrying in ${attempt}s"
            sleep "$attempt"
          done
          # The last call can merge and answer an error too: the pull request is
          # read once more before the run is called failed. Merged by anyone else,
          # closed, or its head pushed since, it ends as it would before a call.
          STATE=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '[.state, .head.sha, .base.ref, .merged, .merge_commit_sha, .merged_by.login] | map(if . == null or . == "" then "-" else tostring end) | @tsv') || STATE=""
          if [ -z "$STATE" ]; then
            echo "::error::PR #${PR} could not be read after the last merge call. Check whether it is merged: if it is, read its merge commit — a re-run does not check it."
            exit 1
          fi
          IFS=$'\t' read -r NOW_STATE NOW_HEAD NOW_BASE NOW_MERGED NOW_COMMIT NOW_BY <<< "$STATE"
          if [ "$NOW_MERGED" = "true" ] && [ "$NOW_BY" = "github-actions[bot]" ]; then
            echo "::notice::PR #${PR} is merged, by this workflow's token: the last call merged it and answered an error. Its merge commit is checked next."
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "sha=${NOW_COMMIT}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$NOW_MERGED" = "true" ]; then
            echo "::notice::PR #${PR} was merged by hand meanwhile: not this run's merge, so nothing is checked or cleaned up here."
            exit 0
          fi
          if [ "$NOW_STATE" = "closed" ]; then
            echo "::notice::PR #${PR} was closed meanwhile, not merged — left as it is."
            exit 0
          fi
          if [ "$NOW_HEAD" != "$HEAD_SHA" ]; then
            if [ -n "${CALLED:-}" ]; then
              echo "::error::PR #${PR}: head moved since the validated SHA, after a merge call that answered an error — such a call can merge, and the pull request can show it late. Check whether it is merged: if github-actions[bot] merged it, read its merge commit — a re-run does not check it; if not, its new head gets its own run."
              exit 1
            fi
            echo "::notice::PR #${PR}: head moved since the validated SHA — leaving it to its own run."
            exit 0
          fi
          echo "::error::PR #${PR} is not shown merged by this workflow after its last merge call. A call can merge and answer an error, and the pull request can show it late: check whether it is merged. If github-actions[bot] merged it, read its merge commit — a re-run does not check it; if a person did, nothing is left to do here; if it is not merged, merge it by hand."
          exit 1

      # The same check as in promote-from-ci (comments there), with the docs
      # rule: a docs-only merge that wrote anything else is red too.
      - name: Check what the merge wrote
        id: check
        if: ${{ !cancelled() && steps.merge.outputs.merged == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          MERGED: ${{ steps.merge.outputs.sha }}
          DOCS_ONLY: 'true'
        run: |
          set -euo pipefail
          # The commit the merge created, listed against its first parent: the
          # tip it landed on, whichever it was at that instant. What the gate
          # holds must not be in it. Every failure is red, never a pass: the
          # merge is done, so there is nothing left to hold, only to report.
          if ! [[ "$MERGED" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "::error::PR #${PR} was merged, but GitHub did not name the commit it created — read by hand what the merge changed on the base branch."
            exit 1
          fi
          # A commit just written can take a moment to be readable: three
          # reads, five and ten seconds apart, before calling it unreadable.
          PARENT=""
          for delay in 0 5 10; do
            sleep "$delay"
            PARENT=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${MERGED}" --jq '.parents[0].sha // ""') || PARENT=""
            if [[ "$PARENT" =~ ^[0-9a-f]{40,64}$ ]]; then break; fi
          done
          if ! [[ "$PARENT" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "::error::The commit that merged PR #${PR} (${MERGED:0:7}) could not be read — read by hand what it changed."
            exit 1
          fi
          WROTE=""
          for delay in 0 5 10; do
            sleep "$delay"
            WROTE=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${PARENT}...${MERGED}" \
                      --jq '{listed: (.files | type), files: [.files[]? | [.filename, (.previous_filename // "")]], changes: [.files[]? | {filename, previous_filename, status, additions, deletions}]}') || WROTE=""
            if [ -n "$WROTE" ] && [ "$(jq -r '.listed' <<< "$WROTE")" = "array" ]; then break; fi
          done
          if [ -z "$WROTE" ] || [ "$(jq -r '.listed' <<< "$WROTE")" != "array" ]; then
            echo "::error::What ${MERGED:0:7} changed could not be listed — read by hand what the merge of PR #${PR} changed."
            exit 1
          fi
          WROTE_ROWS=$(jq -r '.files[] | @tsv' <<< "$WROTE")
          WROTE_COUNT=$(grep -c . <<< "$WROTE_ROWS" || true)
          WROTE_PATHS=$(tr '\t' '\n' <<< "$WROTE_ROWS" | grep . || true)
          # The gate's own rules on what landed: a path CLAUDE_GATE_RE or
          # PROJECT_GATE_RE holds, a test weakened under TEST_HOLD_RE (the
          # gate's selection, AM-8) and, after a docs-only merge, a file outside
          # the docs. A listing of 300 files may be cut short: red as well.
          HELD=0
          NON_DOCS=0
          if [ -n "$WROTE_PATHS" ]; then
            HELD=$(grep -i -E -c -e "$CLAUDE_GATE_RE" -e "$PROJECT_GATE_RE" <<< "$WROTE_PATHS" || true)
            if [ "$DOCS_ONLY" = "true" ]; then NON_DOCS=$(grep -E -v -c '(\.md$|^docs/|^LICENSE$|^\.gitignore$)' <<< "$WROTE_PATHS" || true); fi
          fi
          WROTE_SHRUNK=$(jq -r '.changes[] | select(.status != "added" and ((.status == "modified" and .deletions == 0 and .additions > 0) | not)) | .filename, (.previous_filename // empty)' <<< "$WROTE")
          WEAKENED=0
          if [ -n "$WROTE_SHRUNK" ]; then WEAKENED=$(grep -i -E -c -e "$TEST_HOLD_RE" <<< "$WROTE_SHRUNK" || true); fi
          if [ "$WROTE_COUNT" -ge 300 ] || [ "$HELD" != "0" ] || [ "$WEAKENED" != "0" ] || [ "$NON_DOCS" != "0" ]; then
            echo "::error::PR #${PR} was merged as ${MERGED:0:7}, which changed ${WROTE_COUNT} file(s) (at 300 the listing may be cut short): ${HELD} held by CLAUDE_GATE_RE or PROJECT_GATE_RE, ${WEAKENED} weakened under TEST_HOLD_RE, ${NON_DOCS} outside the docs after a docs-only merge. The gate judged none of this: read that commit and revert what nobody reviewed. A re-run of this job ends green without checking again (docs/conventions/auto-merge-policy.md § Residual risks)."
            exit 1
          fi
          echo "PR #${PR}: ${MERGED:0:7} changed ${WROTE_COUNT} file(s), none that the gate holds."

      # Same cleanup as in promote-from-ci (reasons and guards there); the two
      # jobs share no steps, exactly like the merge loop above.
      - name: Delete head branch
        if: ${{ !cancelled() && steps.merge.outputs.merged == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          INFO=$(gh pr view "$PR" --json headRefName,headRefOid,isCrossRepository \
            --jq '[.headRefName, .headRefOid, .isCrossRepository] | @tsv')
          IFS=$'\t' read -r HEAD_REF MERGED_OID CROSS_REPO <<< "$INFO"
          if [ "$CROSS_REPO" != "false" ]; then
            echo "PR #${PR}: head branch lives in another repository — nothing to delete here."
            exit 0
          fi
          if [ "$HEAD_REF" = "$DEFAULT_BRANCH" ]; then
            echo "::warning::PR #${PR}: head branch is the default branch — not deleting."
            exit 0
          fi
          # Stacked on top of it, or opened from it: deleting would retarget
          # or close that PR behind its author's back.
          OPEN_ON_TOP=$(gh pr list --state open --base "$HEAD_REF" --json number --jq 'length')
          OPEN_FROM=$(gh pr list --state open --head "$HEAD_REF" --json number --jq 'length')
          if [ "$OPEN_ON_TOP" != "0" ] || [ "$OPEN_FROM" != "0" ]; then
            echo "::notice::PR #${PR}: other open PR(s) still use the head branch (${OPEN_ON_TOP} on top of it, ${OPEN_FROM} from it) — keeping it."
            exit 0
          fi
          if ! [[ "$HEAD_REF" =~ ^[A-Za-z0-9._/@+-]+$ ]]; then
            echo "::warning::PR #${PR}: head branch name needs URL encoding — delete it by hand."
            exit 0
          fi
          # Exact lookup first: "gone" = already deleted (Dependabot, a human)
          # = goal reached. The REST `GET git/ref/…` would need its status
          # line parsed to tell a 404 from an outage; a failed lookup fails.
          CURRENT_OID=$(gh api graphql \
            -f query='query($owner: String!, $name: String!, $ref: String!) { repository(owner: $owner, name: $name) { ref(qualifiedName: $ref) { target { oid } } } }' \
            -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -f ref="refs/heads/${HEAD_REF}" \
            --jq '.data.repository.ref.target.oid // "gone"') \
            || { echo "::error::Could not look up head branch '${HEAD_REF}' of #${PR} — check it by hand."; exit 1; }
          if [ "$CURRENT_OID" = "gone" ]; then
            echo "${HEAD_REF} was already deleted"
            exit 0
          fi
          # A commit pushed since the merge must survive.
          if [ "$CURRENT_OID" != "$MERGED_OID" ]; then
            echo "::warning::PR #${PR}: head branch moved since the merge (${CURRENT_OID:0:7} vs merged ${MERGED_OID:0:7}) — not deleting."
            exit 0
          fi
          if gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${HEAD_REF}"; then
            echo "deleted ${HEAD_REF}"
            exit 0
          fi
          echo "::error::Could not delete head branch '${HEAD_REF}' of #${PR} — delete it by hand."
          exit 1
