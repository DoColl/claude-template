name: CI

# The kit's own checks: the installer's tests (which install every module into
# a scratch project and run its gate), then zizmor on every workflow the kit
# ships, rendered as a project would get them, and on this file.
#
# The first job calls security.yml: gitleaks, then the kit's own gate
# (scripts/security-checks.sh), since the kit installs part of itself at its
# root. The documentation set is skipped, and what the tests read or the kit
# ships is taken back: a Markdown file under modules/ is shipped content.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!**.md'
      - '!LICENSE'
      - '!.gitignore'
      - '.claude/**'
      - '**/.claude/**'
      - 'CLAUDE.md'
      - '**/CLAUDE.md'
      - 'modules/**'
      - 'skills/**'
      - 'README.md'
      - 'docs/module-authoring.md'
  pull_request:
    branches: [main]
    # `edited` too: a pull request retargeted to main is then tested against it
    # (the kit's ci-workflow seed does the same, for the reason AM-9 gives).
    types: [opened, synchronize, reopened, edited]
    paths:
      - '**'
      - '!docs/**'
      - '!**.md'
      - '!LICENSE'
      - '!.gitignore'
      - '.claude/**'
      - '**/.claude/**'
      - 'CLAUDE.md'
      - '**/CLAUDE.md'
      - 'modules/**'
      - 'skills/**'
      - 'README.md'
      - 'docs/module-authoring.md'

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security
    # `$/` is this repository at the caller's commit. `./` means the same to
    # GitHub, but zizmor reports it (self-repository) and GA-2 would fail.
    uses: $/.github/workflows/security.yml
    # The ceiling for the called workflow: its jobs can only narrow it.
    permissions:
      contents: read

  test:
    name: Tests and workflow lint
    needs: [security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The test files are named, never the directory: an older Node takes a
      # bare directory argument for a module to run and fails.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Installer tests on the oldest supported Node (20)
        run: node --test test/*.test.mjs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Installer tests on a current Node (24)
        run: node --test test/*.test.mjs

      - name: Render every module into a scratch project
        run: node bin/harness.mjs init "$RUNNER_TEMP/rendered" --all

      # Pinned to an exact version: each zizmor release adds audits, so a
      # floating one would turn this job red without any change here.
      - name: zizmor — shipped workflows and this one, no finding at any severity
        run: |
          pipx run --spec 'zizmor==1.31.1' zizmor --offline "$RUNNER_TEMP/rendered/.github/workflows/"
          pipx run --spec 'zizmor==1.31.1' zizmor --offline .github/workflows/
