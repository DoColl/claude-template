name: CI

# The kit's own checks: the installer's tests (which install every module into
# a scratch project and run its gate), then zizmor on every workflow the kit
# ships, rendered as a project would get them, and on this file. On a pull
# request, last, the changelog fragment that a change to modules/, lib/ or
# bin/ brings.
#
# It runs on every pull request and push, documentation included. The first
# job calls security.yml: gitleaks, then the kit's own gate
# (scripts/security-checks.sh), since the kit installs part of itself at its
# root; it always runs. The `changes` job says whether the tests have anything
# to judge: 'false' when every changed file is documentation and none is what
# the tests read or the kit ships (a Markdown file under modules/ is shipped
# content, the tests read README.md, CHANGELOG.md, docs/module-authoring.md
# and the fragments under changes/, and hold the root copies the kit installs
# — docs/conventions, docs/adr, docs/runbook, SECURITY_REVIEW*.md — to their
# modules; the gate checks the instruction files). The test
# job is skipped then, which a required check counts as passed. The same shape
# as the ci-workflow skeleton (docs/conventions/ci-workflow.md in a project).
#
# While a session is still at work on a pull request — a draft labelled
# session-active — every job is skipped, and the run ends `skipped`, which
# ready-on-green does not act on. Taking the label off runs CI once, in full,
# and ready-on-green lifts the draft if it is green
# (docs/conventions/ready-on-green.md § A CI workflow that holds its jobs).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` too: a pull request retargeted to main is then tested against it
    # (the kit's ci-workflow seed does the same, for the reason AM-9 gives).
    # `unlabeled` and `ready_for_review`: the session-active label coming off,
    # or a held draft lifted by hand, runs the jobs the label held back.
    types: [opened, synchronize, reopened, edited, unlabeled, ready_for_review]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job carries the same hold in its `if:`, and a test in
# test/install.test.mjs holds each job to it: with one job left to run, a held
# run would end `success` with the tests skipped, and ready-on-green could lift
# the draft on it if the label came off before it read the pull request.
# Drafts only: GitHub does not merge a draft, while a skipped job counts as
# passed for a required check. The test job adds the `changes` verdict.
jobs:
  security:
    name: Security
    if: ${{ !(github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'session-active')) }}
    # `$/` is this repository at the caller's commit. `./` means the same to
    # GitHub, but zizmor reports it (self-repository) and GA-2 would fail.
    uses: $/.github/workflows/security.yml
    # The ceiling for the called workflow: its jobs can only narrow it.
    permissions:
      contents: read

  changes:
    name: Changes the tests read
    if: ${{ !(github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'session-active')) }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # Fails closed, as the skeleton's: 'true' unless the diff was read. On a
      # pull request, the merge commit against its first parent; on a push,
      # the commit pushed when it is the only one. test/install.test.mjs runs
      # this script on a table of changes.
      - name: Anything the tests read?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          code=true
          docs='(\.md$|^docs/|^LICENSE$|^\.gitignore$)'
          read='^(modules|skills|changes)/|^(README|CHANGELOG)\.md$|^docs/module-authoring\.md$|^docs/(conventions|adr|runbook)/|^SECURITY_REVIEW|(^|/)\.claude/|(^|/)CLAUDE\.md$'
          base=""
          if [ "$EVENT" = pull_request ] && git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            base='HEAD^1'
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$(git rev-parse -q --verify 'HEAD^1' || true)" = "$BEFORE" ]; then
            base='HEAD^1'
          fi
          if [ -n "$base" ] && files=$(git diff --no-renames --name-only "$base" HEAD) && [ -n "$files" ] \
             && [ "$(grep -E -v -c "$docs" <<< "$files" || true)" = 0 ] && ! grep -E -q "$read" <<< "$files"; then
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Anything the tests read: $code"

  test:
    name: Tests and workflow lint
    needs: [security, changes]
    if: ${{ !(github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'session-active')) && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The parents of the commit checked out: on a pull request, the last
          # step compares the merge commit with the base it was built on.
          fetch-depth: 2

      # test/factory.test.mjs runs the kit on DoColl/factory-test, a private
      # project that already has it, at the commit test/factory-test.json
      # pins. Read with a fine-grained token limited to that repository,
      # Contents read-only (FACTORY_TEST_TOKEN, an Actions and a Dependabot
      # secret), never kept in the checkout. Without it the checkout fails:
      # the test is required in CI, never skipped.
      - name: The factory-test commit the tests pin
        id: factory
        run: echo "commit=$(node -p 'require("./test/factory-test.json").commit')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DoColl/factory-test
          ref: ${{ steps.factory.outputs.commit }}
          token: ${{ secrets.FACTORY_TEST_TOKEN }}
          path: factory-test
          persist-credentials: false

      # The test files are named, never the directory: an older Node takes a
      # bare directory argument for a module to run and fails.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Installer tests on the oldest supported Node (20)
        env:
          FACTORY_TEST_DIR: ${{ github.workspace }}/factory-test
        run: node --test test/*.test.mjs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Installer tests on a current Node (24)
        env:
          FACTORY_TEST_DIR: ${{ github.workspace }}/factory-test
        run: node --test test/*.test.mjs

      - name: Render every module into a scratch project
        run: node bin/harness.mjs init "$RUNNER_TEMP/rendered" --all

      # Pinned to an exact version: each zizmor release adds audits, so a
      # floating one would turn this job red without any change here.
      - name: zizmor — shipped workflows and this one, no finding at any severity
        run: |
          pipx run --spec 'zizmor==1.31.1' zizmor --offline "$RUNNER_TEMP/rendered/.github/workflows/"
          pipx run --spec 'zizmor==1.31.1' zizmor --offline .github/workflows/

      # A pull request that changes what the kit ships or runs (modules/, lib/,
      # bin/) adds its changelog fragment, changes/<slug>.md, which
      # bin/release.mjs turns into the next CHANGELOG.md entry. The tests check
      # the format of every fragment; this checks that the pull request adds
      # one. The commit checked out is the merge commit GitHub builds for the
      # pull request: compared with its first parent, the base it was built
      # on, it is what merging would bring, and no value of the event enters
      # the script. File names are printed indented, never at the start of a
      # line, where the runner reads its commands. Runs even when a step above
      # failed, so that a missing fragment shows in the same run.
      # test/install.test.mjs runs this script on a table of pull requests.
      - name: Changelog fragment — a change to modules/, lib/ or bin/ adds one under changes/
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            echo "::error::HEAD is not the merge commit of a pull request, or its parents were not fetched (fetch-depth: 2)"
            exit 1
          fi
          code=$(git diff --no-renames --name-only 'HEAD^1' HEAD -- modules lib bin)
          if [ -z "$code" ]; then
            echo "Nothing changes under modules/, lib/ or bin/: no fragment required."
            exit 0
          fi
          echo "Changes under modules/, lib/ or bin/:"
          printf '%s\n' "$code" | sed 's/^/  /'
          added=$(git diff --no-renames --name-only --diff-filter=A 'HEAD^1' HEAD -- changes)
          if [ -n "$added" ]; then
            echo "Changelog fragment(s) added:"
            printf '%s\n' "$added" | sed 's/^/  /'
            exit 0
          fi
          echo "::error::This pull request changes modules/, lib/ or bin/ and adds no changelog fragment. Add changes/<slug>.md: 'bump: patch', 'bump: minor' or 'bump: major' on its first line, a blank line, the lines of the entry, then a paragraph that starts with 'By hand:' ('By hand: nothing.' when there is nothing to do). The top of CHANGELOG.md gives the format."
          exit 1
